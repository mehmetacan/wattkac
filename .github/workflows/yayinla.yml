name: Instagram'a yayınla

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dakikada bir kuyruğu kontrol eder (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (hiçbir şey paylaşmaz)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zamanı gelenleri paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE || 'https://graph.instagram.com' }}
          YAYIN_AKTIF: ${{ vars.YAYIN_AKTIF }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py
      - name: Kuyruk durumunu kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain queue)" ]; then
            git config user.name "wattkac-bot"
            git config user.email "wattkac-bot@users.noreply.github.com"
            git add queue
            git commit -m "Kuyruk güncellendi [skip ci]"
            git pull --rebase
            git push
          fi
