name: İstasyon verisini güncelle

# 1) OpenStreetMap'ten istasyonları çeker  2) EPDK adreslerini konuma çevirir (kaldığı yerden devam eder)
# 3) ikisini birleştirip site/istasyonlar.json üretir.
on:
  schedule:
    - cron: "17 2 * * *"   # her gün 05:17 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: istasyonlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap istasyonlarını çek
        run: python3 tools/istasyon_cek.py data/osm/istasyonlar_osm.json
      - name: EPDK adreslerini konuma çevir (en fazla 4 saat)
        run: python3 tools/epdk_konum.py 14400
        continue-on-error: true
      - name: Birleştir
        if: always()
        run: python3 tools/istasyon_birlestir.py site/istasyonlar.json
      - name: GitHub Pages kopyasını güncelle
        if: always()
        run: |
          mkdir -p docs/kampanyalar
          cp site/istasyonlar.json docs/kampanyalar/istasyonlar.json
      - name: Değişiklik varsa kaydet
        if: always()
        run: |
          git config user.name "wattkac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm data/epdk site/istasyonlar.json docs/kampanyalar/istasyonlar.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "İstasyon verisi güncellendi"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
