name: İstasyon verisini güncelle

# 1) OpenStreetMap'ten istasyonları çeker  1b) ZES/Ovolt/WAT/Trugo/VoltUp'ın kendi haritalarından (VoltUp: istasyon fiyatlarıyla) çeker  2) EPDK'nın açık servisinden tüm halka açık istasyonları (kesin koordinat + soket) çeker
# 3) ikisini birleştirip site/istasyonlar.json üretir.
on:
  schedule:
    - cron: "17 2 * * *"   # her gün 05:17 (Türkiye saati)
  workflow_dispatch:
    inputs:
      konum_cevir:
        description: "(Yalnızca EPDK servisi verisi yoksa) adres arama adımı da çalışsın mı (4 saate kadar sürer)?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: istasyonlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap istasyonlarını çek
        run: python3 tools/istasyon_cek.py data/osm/istasyonlar_osm.json
      # VoltUp'ın istasyon bazlı fiyat listesi bir Blazor Server sayfası (düz HTTP ile okunamıyor, JSON adresi yok):
      # sayfa tarayıcıyla günde bir kez açılır. Başarısız olursa data/aglar/voltup_fiyat.json'daki önceki fiyatlar kullanılır.
      - name: VoltUp istasyon fiyatlarını oku (tarayıcıyla tek sayfa yüklemesi)
        timeout-minutes: 10
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/voltup_fiyat.mjs
        continue-on-error: true
      - name: Ağların resmi haritalarından istasyonları çek
        run: python3 -u tools/ag_istasyonlari.py
        continue-on-error: true
      - name: Open Charge Map istasyonlarını çek
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: python3 -u tools/ocm_cek.py data/ocm/istasyonlar_ocm.json
        continue-on-error: true
      - name: EPDK'nın açık servisinden istasyonları çek (kesin koordinat + soketler; günde tek istek)
        run: python3 -u tools/epdk_cek.py
        continue-on-error: true
      # Aşağıdaki iki adım yalnızca EPDK servisinden hiç veri alınamadıysa (data/epdk/epdk_api.json yoksa) çalışan eski yöntemdir
      - name: (Yedek) EPDK adreslerini konuma çevir (en fazla 4 saat)
        if: hashFiles('data/epdk/epdk_api.json') == '' && (github.event_name != 'workflow_dispatch' || inputs.konum_cevir)
        run: python3 -u tools/epdk_konum.py 14400
        continue-on-error: true
      - name: (Yedek) Yaklaşık konumları tesislere (Shell, AVM, dinlenme tesisi) göre kesinleştir
        if: hashFiles('data/epdk/epdk_api.json') == ''
        run: python3 -u tools/poi_konum.py
        continue-on-error: true
      - name: Seçili istasyon kampanya listelerini oku (Otopriz %30 vb.)
        run: python3 -u tools/secili_istasyonlar.py
        continue-on-error: true
      - name: Birleştir
        if: always()
        run: python3 tools/istasyon_birlestir.py site/istasyonlar.json
      - name: GitHub Pages kopyasını güncelle
        if: always()
        run: |
          mkdir -p docs/kampanyalar
          cp site/istasyonlar.json docs/kampanyalar/istasyonlar.json
      - name: Değişiklik varsa kaydet
        if: always()
        run: |
          git config user.name "wattkac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm data/ocm data/epdk data/aglar data/secili_istasyonlar.json site/istasyonlar.json docs/kampanyalar/istasyonlar.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "İstasyon verisi güncellendi"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
