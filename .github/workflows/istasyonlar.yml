name: İstasyon verisini güncelle

# Türkiye'deki şarj istasyonlarını OpenStreetMap'ten günde bir kez çeker ve site/istasyonlar.json'a yazar.
on:
  schedule:
    - cron: "17 2 * * *"   # her gün 05:17 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: istasyonlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: İstasyonları çek
        run: python3 tools/istasyon_cek.py site/istasyonlar.json
      - name: GitHub Pages kopyasını güncelle
        run: |
          mkdir -p docs/kampanyalar
          cp site/istasyonlar.json docs/kampanyalar/istasyonlar.json
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "wattkac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/istasyonlar.json docs/kampanyalar/istasyonlar.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "İstasyon verisi güncellendi"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
